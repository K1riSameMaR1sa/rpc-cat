<title>RPC CAT · 管理局翻译工作台（单文件版）</title>
<meta name="description" content="RPC 管理局翻译辅助工具：TMX 对齐制作、记忆库管理、CAT 式翻译工作台。纯前端，数据留在本地。">
<style>
/* RPC CAT — dark "Authority" theme
   Palette: near-black surfaces, bone text, Authority red accent. */

:root {
  --bg:        #0b0b0d;
  --bg-2:      #101014;
  --surface:   #141418;
  --surface-2: #1b1b21;
  --surface-3: #23232b;
  --line:      #2c2c36;
  --line-2:    #3a3a47;
  --text:      #e8e6e1;
  --text-dim:  #a3a09a;
  --text-mute: #6f6d69;
  --accent:    #c62828;
  --accent-2:  #e53935;
  --ok:        #3fa66b;
  --warn:      #d6a13a;
  --hi:        #f0c419;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --serif: Georgia, "Songti SC", "Noto Serif SC", serif;
}

/* ---------------------------------------------------------------- topbar */

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- topbar */

.topbar {
  display: flex; align-items: center; gap: 14px;
  height: 52px; padding: 0 14px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}
.brand {
  display: flex; align-items: center; gap: 8px;
  color: var(--accent-2);
  font-weight: 700; letter-spacing: .14em; font-size: 14px;
}
.brand span { color: var(--text); }
.spacer { flex: 1; }

.mem-picker { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12px; }
.mem-picker select {
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 5px 9px; min-width: 190px; max-width: 320px;
}

/* ---------------------------------------------------------------- layout */

.layout { display: flex; height: calc(100vh - 52px); }

.sidebar {
  width: 172px; flex: 0 0 172px;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 10px 8px;
  gap: 3px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: 0; border-radius: 6px;
  padding: 9px 11px; cursor: pointer; text-align: left;
  color: var(--text-dim); font-size: 13.5px;
  transition: background .12s, color .12s;
}
.nav-item .ico { width: 16px; text-align: center; opacity: .8; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--surface-3); color: var(--text);
  box-shadow: inset 2px 0 0 var(--accent);
}
.sidebar-foot { margin-top: auto; padding: 8px 11px; }

.view {
  flex: 1; min-width: 0; overflow: auto;
  padding: 18px 20px 60px;
  outline: none;
}

/* ---------------------------------------------------------------- atoms */

.btn {
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 6px 12px; cursor: pointer;
  color: var(--text); font-size: 13px; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: #4a4a5a; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: #ff8a80; border-color: #5a2b2b; }

input[type=text], input[type=search], input[type=number], textarea, select {
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 6px 9px; width: 100%;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(198,40,40,.18);
}
textarea { resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.6; }

h1 { font-size: 19px; margin: 0 0 4px; font-weight: 650; letter-spacing: .01em; }
h2 { font-size: 15px; margin: 22px 0 9px; font-weight: 650; color: var(--text); }
h3 { font-size: 13px; margin: 16px 0 7px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
p.sub { color: var(--text-dim); margin: 0 0 16px; font-size: 13px; }
.tiny { font-size: 11.5px; color: var(--text-mute); }

/* Field labels must sit on their own line above the control. Relying on the
   inline default puts the label beside the input when the input is an
   inline-block, and it ends up overlapping it. */
.field-label { display: block; margin-bottom: 4px; }
.mono { font-family: var(--mono); }
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 5px; }
.grow { flex: 1; min-width: 0; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 14px 16px;
}
.card + .card { margin-top: 14px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-weight: 600; color: var(--text-dim);
  border-bottom: 1px solid var(--line-2); padding: 7px 8px;
  position: sticky; top: 0; background: var(--surface); z-index: 1;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
}
table.data td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
table.data tr:hover td { background: var(--surface-2); }
.scroll-y { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 7px; }

.pill {
  display: inline-block; padding: 1px 7px; border-radius: 99px;
  font-size: 11px; font-family: var(--mono);
  border: 1px solid var(--line-2); color: var(--text-dim);
}
.pill.exact { border-color: #2f6b47; color: #7fd6a4; }
.pill.fuzzy { border-color: #6b5a2f; color: #e0c07a; }
.pill.new   { border-color: #5a2b2b; color: #ff9a90; }
.pill.ok    { border-color: #2f6b47; color: #7fd6a4; }

.empty {
  border: 1px dashed var(--line-2); border-radius: 8px;
  padding: 34px 20px; text-align: center; color: var(--text-mute);
}

/* ---------------------------------------------------------------- workbench */

.wb { display: grid; grid-template-columns: 1fr 330px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .wb { grid-template-columns: 1fr; } }

.seg-list { display: flex; flex-direction: column; gap: 9px; }

.seg {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--line-2);
  border-radius: 7px; padding: 11px 13px;
  transition: border-color .12s, background .12s;
}
.seg.active { border-left-color: var(--accent); background: var(--surface-2); }
.seg.done   { border-left-color: var(--ok); }
.seg-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.seg-num { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); min-width: 28px; }
.seg-src { color: var(--text); font-size: 14px; line-height: 1.7; }
.seg-src mark, .seg-tgt mark {
  background: rgba(240,196,25,.20); color: var(--hi);
  border-radius: 3px; padding: 0 2px;
}
.seg textarea { margin-top: 9px; min-height: 62px; }
.seg-matches { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.match {
  border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 9px; background: var(--surface-2); cursor: pointer;
  font-size: 12.5px;
}
.match:hover { border-color: var(--accent); }
.match .m-top { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.match .m-src { color: var(--text-dim); }
.match .m-tgt { color: var(--text); }

.side-panel { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 12px; }
.progress-outer { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress-inner { height: 100%; background: var(--accent); width: 0; transition: width .2s; }

/* ---------------------------------------------- structure-preserving blocks */

/* blank line in the source: shown so the layout is visible, not editable */
.block-gap {
  height: 9px; margin: 1px 0;
  border-left: 3px solid var(--line);
  border-radius: 3px; background: repeating-linear-gradient(
    90deg, var(--surface-3) 0 5px, transparent 5px 10px);
  opacity: .5;
}
.block-gap:hover { opacity: .9; }

.block-markup {
  display: flex; align-items: baseline; gap: 9px;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--line-2);
  border-radius: 6px; padding: 7px 11px; margin: 2px 0;
}
.block-markup code {
  font-family: var(--mono); font-size: 12.5px; color: var(--text-mute);
  white-space: pre-wrap; word-break: break-all;
}

.block-code {
  background: #0d0f12; border: 1px solid var(--line);
  border-left: 3px solid #3a4a5a;
}
.block-pre {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  background: #0d0f12; border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; margin: 7px 0 0;
  white-space: pre-wrap; word-break: break-word;
  color: #b9c4cf; overflow-x: auto;
}
/* the exact original line, shown so markers and spacing stay visible */
.block-raw {
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
  color: var(--text-mute); background: transparent;
  border-left: 2px solid var(--line-2); padding: 0 0 0 9px;
  margin: 0 0 8px; white-space: pre-wrap; word-break: break-word;
}

.sentence {
  border-left: 2px solid transparent;
  padding: 5px 0 5px 9px; margin: 3px 0;
  border-radius: 0 5px 5px 0;
}
.sentence.active { background: var(--surface-2); border-left-color: var(--accent); }
.sentence.done { border-left-color: var(--ok); }
.sentence-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.sent-idx { font-size: 10.5px; color: var(--text-mute); min-width: 22px; }
.sentence textarea { margin-top: 5px; min-height: 34px; }

/* ------------------------------------------------------------- term chips */

.term-row {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px;
}
.term-chip {
  display: inline-flex; align-items: baseline; gap: 5px;
  background: var(--surface-3); border: 1px solid var(--line-2);
  border-radius: 99px; padding: 2px 9px;
  font-size: 11.5px; cursor: pointer; color: var(--text-dim);
  transition: border-color .12s, background .12s, color .12s;
  max-width: 100%;
}
.term-chip:hover { border-color: var(--accent); color: var(--text); background: #2a2a33; }
.term-en { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.term-arrow { color: var(--text-mute); }
.term-zh { color: var(--hi); white-space: nowrap; }

/* ---------------------------------------------------------------- align */

.align-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.align-table th {
  text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line-2);
  color: var(--text-dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.align-table td { border-bottom: 1px solid var(--line); padding: 8px 9px; vertical-align: top; }
.align-table tr:hover td { background: var(--surface-2); }
.align-table tr.active td { background: var(--surface-3); }
.align-table tr.unpaired td { opacity: .5; }
.score-cell { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.score-bar { display: inline-block; width: 34px; height: 5px; border-radius: 3px;
  background: var(--surface-3); overflow: hidden; vertical-align: middle; margin-right: 5px; }
.score-bar > i { display: block; height: 100%; background: var(--accent); }

/* ---------------------------------------------------------------- misc */

.toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: 100;
  display: flex; flex-direction: column; gap: 8px; max-width: 380px;
}
.toast {
  background: var(--surface-3); border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 9px 13px; font-size: 13px;
  box-shadow: 0 6px 22px rgba(0,0,0,.5);
  animation: slidein .18s ease-out;
}
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--accent-2); }
@keyframes slidein { from { transform: translateY(8px); opacity: 0; } }

.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.66);
  display: flex; align-items: center; justify-content: center;
  z-index: 90; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 9px; padding: 20px; max-width: 720px; width: 100%;
  max-height: 86vh; overflow: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal h2 { margin-top: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 7px; padding: 11px 13px;
}
.stat .v { font-size: 20px; font-weight: 650; font-family: var(--mono); }
.stat .k { font-size: 11.5px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .05em; }

.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }

.loading { color: var(--text-mute); padding: 20px 0; text-align: center; }
.loading::after { content: '…'; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

::selection { background: rgba(198,40,40,.35); }

/* ------------------------------------------------------ boot failure notice */

.boot-warn {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(8,8,10,.94);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; overflow: auto;
}
.boot-warn[hidden] { display: none; }
.boot-warn-inner {
  max-width: 640px;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 10px; padding: 24px 26px;
  box-shadow: 0 24px 70px rgba(0,0,0,.7);
}
.boot-warn-inner h2 { margin: 0 0 12px; color: var(--accent-2); font-size: 18px; }
.boot-warn-inner p { margin: 0 0 11px; color: var(--text-dim); }
.boot-warn-inner ol { margin: 0 0 14px; padding-left: 22px; color: var(--text-dim); }
.boot-warn-inner li { margin-bottom: 7px; }
.boot-warn-inner strong { color: var(--text); }
.boot-warn code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface-3); border: 1px solid var(--line-2);
  border-radius: 4px; padding: 1px 5px; color: var(--hi);
}

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: var(--bg-2); }
::-webkit-scrollbar-thumb { background: #33333d; border-radius: 6px; border: 2px solid var(--bg-2); }
::-webkit-scrollbar-thumb:hover { background: #41414e; }

</style>

</div>

rpc-wiki.net/memetics-analysis</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/memetics-analysis</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9142</prop>\n    <prop type=\"x-seg-score\">1.0</prop>\n    <tuv xml:lang=\"en-US\"><seg>Severity and spread are more controversial elements that further define the capacity of the meme. Spread is the limitation of the concept to which the meme is tied- that is, a meme linked to a niche idea that exists in only a handful of separated languages has low spread, while a meme with high severity is able to overcome that limitation thanks to its potency.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>烈度和传播能力在确定模因的效用上有争议：传播能力衡量与该模因关联的概念的受限程度，即如果一个模因只和少数相互孤立的语言中存在着的小众概念相关联，那么它只有低传播能力； 但具有高烈度的模因能通过其能力打破这种限制。</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-052#66.0\">\n    <prop type=\"x-doc\">rpc-052</prop>\n    <prop type=\"x-title\">RPC-052</prop>\n    <prop type=\"x-slug-en\">rpc-052</prop>\n    <prop type=\"x-slug-zh\">rpc-052</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-052</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-052</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8333</prop>\n    <prop type=\"x-seg-score\">1.0</prop>\n    <tuv xml:lang=\"en-US\"><seg>Stark: What are you talking about?</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>斯塔克：你在说什么？</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-265#9.0\">\n    <prop type=\"x-doc\">rpc-265</prop>\n    <prop type=\"x-title\">RPC-265</prop>\n    <prop type=\"x-slug-en\">rpc-265</prop>\n    <prop type=\"x-slug-zh\">rpc-265</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-265</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-265</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">1.0</prop>\n    <prop type=\"x-seg-score\">1.0</prop>\n    <tuv xml:la \n    <prop type=\"x-title\">RPC-727</prop>\n    <prop type=\"x-slug-en\">rpc-727</prop>\n    <prop type=\"x-slug-zh\">rpc-727</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-727</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-727</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8346</prop>\n    <prop type=\"x-seg-score\">0.8346</prop>\n    <tuv xml:lang=\"en-US\"><seg>RESEARCH AREA(S)</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>研究区域</seg></tuv>\n  </tu>\n  <tu tuid=\"theseus:first-day#31.2\">\n    <prop type=\"x-doc\">theseus:first-day</prop>\n    <prop type=\"x-title\">第一日</prop>\n    <prop type=\"x-slug-en\">first-day</prop>\n    <prop type=\"x-slug-zh\">theseus:first-day</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/first-day</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/theseus:first-day</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9814</prop>\n    <prop type=\"x-seg-score\">0.8345</prop>\n    <tuv xml:lang=\"en-US\"><seg>corrupting the house of God in Eastern Orthodoxy.\"</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>在东正教里，这可是在玷污上帝的殿堂。 ”</seg></tuv>\n  </tu>\n  <tu tuid=\"theseus:rpc-691#15.5\">\n    <prop type=\"x-doc\">theseus:rpc-691</prop>\n    <prop type=\"x-title\">RPC-691</prop>\n    <prop type=\"x-slug-en\">rpc-691</prop>\n    <prop type=\"x-slug-zh\">theseus:rpc-691</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-691</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/theseus:rpc-691</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8437</prop>\n    <prop type=\"x-seg-score\">0.8341</prop>\n    <tuv xml:lang=\"en-US\"><seg>But the boils hurt so much.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>但疖子痛得要命。</seg></tuv>\n  </tu>\n  <tu tuid=\"an-incomplete-history-of-the-authority#60.2\"> ck-score\">0.8823</prop>\n    <prop type=\"x-seg-score\">0.8324</prop>\n    <tuv xml:lang=\"en-US\"><seg>I recall a man with a bag over his head, stumbling through the street.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>我记得一个戴着袋子的男人在街上蹒跚爬行。</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-973#133.1\">\n    <prop type=\"x-doc\">rpc-973</prop>\n    <prop type=\"x-title\">RPC-973</prop>\n    <prop type=\"x-slug-en\">rpc-973</prop>\n    <prop type=\"x-slug-zh\">rpc-973</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-973</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-973</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8878</prop>\n    <prop type=\"x-seg-score\">0.8324</prop>\n    <tuv xml:lang=\"en-US\"><seg>They're still healing.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>它们还处在愈合期。</seg></tuv>\n  </tu>\n  <tu tuid=\"an-incomplete-history-of-the-authority#30.2\">\n    <prop type=\"x-doc\">an-incomplete-history-of-the-authority</prop>\n    <prop type=\"x-title\">一部不完整的管理局史</prop>\n    <prop type=\"x-slug-en\">an-incomplete-history-of-the-authority</prop>\n    <prop type=\"x-slug-zh\">an-incomplete-history-of-the-authority</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/an-incomplete-history-of-the-authority</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/an-incomplete-history-of-the-authority</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8167</prop>\n    <prop type=\"x-seg-score\">0.8323</prop>\n    <tuv xml:lang=\"en-US\"><seg>Fort Columbiad is left abandoned for the next 20 years.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>哥伦比亚堡(Fort Columbiad)在接下来的二十年内被废弃。</seg></tuv>\n  </tu>\n  <tu tuid=\"the-tetranaughts-and-their-stolen-sleigh#32.1\">\n    <prop type=\"x-doc\">the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-title\">GRP-619 - “特特拉诺特人与他们被盗的雪橇”</prop>\n    <prop type=\"x ></tuv>\n  </tu>\n  <tu tuid=\"the-tetranaughts-and-their-stolen-sleigh#119.2\">\n    <prop type=\"x-doc\">the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-title\">GRP-619 - “特特拉诺特人与他们被盗的雪橇”</prop>\n    <prop type=\"x-slug-en\">the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-slug-zh\">the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/the-tetranaughts-and-their-stolen-sleigh</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.6203</prop>\n    <prop type=\"x-seg-score\">0.8309</prop>\n    <tuv xml:lang=\"en-US\"><seg>Utilizing the abandoned toy-making machinery, the GRPC would construct the hypothetical FTL ship supposedly stolen by the fictional character Santa Claus.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>利用废弃的玩具制造机械，GRPC将建造那艘据称被虚构人物圣诞老人盗走的假想超光速飞船。</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-550#11.1\">\n    <prop type=\"x-doc\">rpc-550</prop>\n    <prop type=\"x-title\">RPC-550</prop>\n    <prop type=\"x-slug-en\">rpc-550</prop>\n    <prop type=\"x-slug-zh\">rpc-550</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-550</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-550</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.708</prop>\n    <prop type=\"x-seg-score\">0.8308</prop>\n    <tuv xml:lang=\"en-US\"><seg>Recorded instances of RPC-550-A grown out of a subject that has made contact with RPC-550 have been known to correspond with several known and unknown species of flora.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>已记录的从与RPC-550接触的受试者中生长出的RPC-550-A实例，与几种已知和未知的植物物种相对应。</seg></tuv>\n  </tu>\n  <tu tuid=\"theseus:first-day#18.9\">\n    <prop type=\"x-doc\">theseus:first-day</prop>\n    <prop type=\"x-title\">第一日</prop>\n    <prop type=\"x-slug-en\">first-day</prop>\n    <prop type=\"x-slug-zh\">theseus:first-day</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/first-day</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/theseus:first-day</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9046</prop>\n    <prop type=\"x-seg-score\">0.8306</prop>\n    <tuv xml:lang=\"en-US\"><seg>What risk.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>多大的风险。</seg></tuv>\n  </tu>\n  <tu tuid=\"vatican-primacy-hub#191.1\">\n    <prop type=\"x-doc\">vatican-primacy-hub</prop>\n    <prop type=\"x-title\">至高秘书处中心页</prop>\n    <prop type=\"x-slug-en\">vatican-primacy-hub</prop>\n    <prop type=\"x-slug-zh\">vatican-primacy-hub</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/vatican-primacy-hub</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/vatican-primacy-hub</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9525</prop>\n    <prop type=\"x-seg-score\">0.8302</prop>\n    <tuv xml:lang=\"en-US\"><seg>What they found inside shocked them to their core: Within the building were miles of containment cells filled with sacred relics and strange entities, humans left in decrepit cells later discovered to be missing persons, and cadavers of failed experimentation littering the hallways.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>而在这一设施内找到的事物则震撼了每一个人：建筑中布满了包含神圣圣髑以及其它奇异实体的收容单元，在事后被确认为失踪人口的被关押在破旧牢房中的人类，以及布满了实验失败的生物遗骸的走道。</seg></tuv>\n  </tu>\n  <tu tuid=\"cosmic-embers-hub-writers-guide#51.1\">\n    <prop type=\"x-doc\">cosmic-embers-hub-writers-guide</prop>\n    <prop type=\"x-title\">寰宇余烬中心页作者指导</prop>\n    <prop type=\"x-slug-en\">cosmic-embers-hub-writers-guide</prop>\n    <prop type=\"x-slug-zh\">cosmic-embers-hub-writers-guide</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/cosmic-embers-hub-writers-guide</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/cosmic-embers-hub-writers-guide</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9827</prop>\n    <prop type=\"x-seg-score\">0.8299</prop>\n    <tuv xml:lang=\"en-US\"><seg>Miles or even light-years from the closest human civilization, isolation gives way to helplessness, and helplessness gives way to paranoia, superstition, and fear.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>文明与文明之间相隔千里乃至光年，隔离导致无助，无助又将催生偏执、迷信以及恐惧。</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-830#21.2\">\n    <prop type=\"x-doc\">rpc-830</prop>\n    <prop type=\"x-title\">RPC-830</prop>\n    <prop type=\"x-slug-en\">rpc-830</prop>\n    <prop type=\"x-slug-zh\">rpc-830</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-830</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-830</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.8571</prop>\n    <prop type=\"x-seg-score\">0.8299</prop>\n    <tuv xml:lang=\"en-US\"><seg>From the windows, one may view the numerous structures dotting the underground landscape of the city.</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>从窗户向外，能看到数个建筑物散布于地底，形成城市。</seg></tuv>\n  </tu>\n  <tu tuid=\"rpc-813#151.1\">\n    <prop type=\"x-doc\">rpc-813</prop>\n    <prop type=\"x-title\">RPC-813</prop>\n    <prop type=\"x-slug-en\">rpc-813</prop>\n    <prop type=\"x-slug-zh\">rpc-813</prop>\n    <prop type=\"x-source-url\">https://rpc-wiki.net/rpc-813</prop>\n    <prop type=\"x-target-url\">https://rpc-wiki-cn.wikidot.com/rpc-813</prop>\n    <prop type=\"x-alignment-level\">sentence</prop>\n    <prop type=\"x-block-score\">0.9714</prop>\n    <prop type=\"x-seg-score\">0.8293</prop>\n    <tuv xml:lang=\"en-US\"><seg>At any moment, something could happen that could hurt you—even kill you, and you don't mind?\"</seg></tuv>\n    <tuv xml:lang=\"zh-CN\"><seg>说不定什么时候就会发生什么莫名其妙的事情，伤了你——甚至杀了你，你一点一点都不在乎吗？ ”</seg></tuv>\n  </tu>\n 【文体：临床腔】
译文必须符合 RPC 管理局／SCP 基金会档案的「临床腔」，判据如下：
- 客观、冷静、程式化，像官方技术报告或收容档案；不带情绪、不做文学渲染。
- 多用无主句与被动式：「已被收容」「应予以销毁」「不得接触」「经由……确认」。
- 固定套语照用：项目编号、项目分级、收容措施、描述、发现记录、附录、机动专项组、权限等级。
- 数字、日期、单位用阿拉伯数字与标准写法（2017年5月12日、3.75G、2km/h、██% ）。
- 不要口语、网络用语、感叹式表达；不要「的」字堆积的冗赘长句。
- 专有名词、机构名、职务名严格采用下方术语表给出的译法；术语表没给的人名地名按通行音译。
- 涂黑与删节标记原样保留：███、[已编辑]、[数据删除]、[需要权限]、[已删节]。
- 行内标记原样保留：[[...]]、@@...@@、**...**、//...//、{{...}}、列表符号与换行。
- 代码块、编号、无实义的技术符号（如 SMAP-1: OK、<<ERROR>>）原样输出，不要翻译。

function stripHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const sel of ['script', 'style', 'nav', 'header', 'footer', '#side-bar', '#page-tags']) {
    for (const el of doc.querySelectorAll(sel)) el.remove();
  }
  const content = doc.querySelector('#page-content') || doc.body;
  const blocks = [];
  for (const el of content.querySelectorAll('p, li, h1, h2, h3, h4, h5, h6, td, blockquote')) {
    const t = (el.textContent || '').replace(/\s+/g, ' ').trim();

async function toolsDialog(ctx) {
  const mem = ctx.state.activeMemory;

  modal({
    title: '工具',
    body: h('div',
      h('h3', { style: { marginTop: 0 } }, '去重'),
      h('p.dim', `当前记忆库有 ${fmtNum(dupes.sameSrcSameTgt)} 条完全重复（源文与译文都相同），`
        + `${fmtNum(dupes.sameSrcDiffTgt)} 组同一源文存在多个不同译文。`),
      h('button.btn', {
        onclick: async (c) => {
          c();
          await dedupeExact(ctx);
        },
      }, '删除完全重复的条目'),
      h('hr.sep'),
      h('h3', '重建索引'),
      h('p.dim', '编辑大量条目后，检索索引可能与数据库不同步。'),
      h('button.btn', {
        onclick: async (c) => { c(); await ctx.loadActiveIndex(); },
      }, '重建当前记忆库索引'),
      h('hr.sep'),
      h('h3', '统计'),
      h('p.tiny', `记忆库 ID：${mem.id} · 创建于 ${fmtDate(mem.createdAt)}`),
    ),
  });
}

function countDuplicates(ctx) {
  const idx = ctx.state.index;
  if (!idx) return { sameSrcSameTgt: 0, sameSrcDiffTgt: 0 };
  const bySrc = new Map();
  for (const u of idx.units) {
    const k = normalize(u.src);
    let list = bySrc.get(k);
    if (!list) { list = []; bySrc.set(k, list); }
    list.push(u.tgt);
  }
  let sameSrcSameTgt = 0;
  let sameSrcDiffTgt = 0;
  for (const list of bySrc.values()) {
    if (list.length > 1) {
      const uniq = new Set(list);
      sameSrcSameTgt += list.length - uniq.size;
      if (uniq.size > 1) sameSrcDiffTgt += 1;
    }
  }
  return { sameSrcSameTgt, sameSrcDiffTgt };
}

async function dedupeExact(ctx) {
  const idx = ctx.state.index;
  if (!idx) { toast('索引未就绪', 'err'); return; }
  const seen = new Set();
  const remove = [];
  for (const u of idx.units) {
    const k = normalize(u.src) + '\u0000' + u.tgt;
    if (seen.has(k)) remove.push(u.id);
    else seen.add(k);
  }
  if (!remove.length) { toast('没有完全重复的条目', 'ok'); return; }
  const ok = await confirmDialog(`将删除 ${fmtNum(remove.length)} 条完全重复的条目，继续？`,
    { danger: true, okLabel: '删除' });
  if (!ok) return;
  await db.deleteUnits(remove);
  await ctx.refreshMemories();
  await ctx.loadActiveIndex({ silent: true });
  toast(`已删除 ${fmtNum(remove.length)} 条`, 'ok');
  refreshRows(ctx);
}

  } catch (err) {
    document.getElementById('view').append(
      h('div.card', h('h2', '无法初始化本地数据库'), h('p', err.message),
        h('p.tiny', '若使用无痕模式或禁用了本地存储，请改用普通窗口。')));
    return;
  }

  for (const btn of document.querySelectorAll('.nav-item')) {
    btn.addEventListener('click', () => setView(btn.dataset.view));
  }
  document.getElementById('activeMemory').addEventListener('change', (e) => {
    const raw = e.target.value;
    const id = raw === SESSION_ID ? SESSION_ID : (raw ? Number(raw) : null);
    setActiveMemory(id);
  });
  document.getElementById('btnImportTmx').addEventListener('click', async () => {
    const f = await pickFile({ accept: '.tmx,.xml' });
    if (f) await importTmxFile(f);
  });
  document.getElementById('btnExportTmx').addEventListener('click', () => exportActiveMemory('tmx'));
  document.getElementById('btnHelp').addEventListener('click', showHelp);

  // Re-render when something a view actually depends on changes — the active
  // memory, or whether the fuzzy index has finished building.  Without this the
  // workbench would keep showing "no matches" until the user touched something.
  let lastKey = '';
  subscribe(() => {
    const key = [
      state.view,
      state.activeMemoryId,
      state.indexBuilding ? 1 : 0,
      state.index ? state.index.size : -1,
      state.memories.map((m) => `${m.id}:${m.count}`).join(','),
    ].join('|');
    if (key === lastKey) return;
    lastKey = key;
    renderView();
  });

  // config first: the first-run dialog needs to know whether a master memory
  // exists and what the licence text says
  state.config = await loadConfig();
  // the term base is small (a few tens of KB); load it once at startup
  state.glossary = await loadGlossary();
  if (state.glossary) {
    console.info(`[rpc-cat] 术语库已载入：${state.glossary.size} 条`);
  }
  // DeepSeek settings (key/model) live in the local database, not in the repo
  await loadAiSettings();

  await refreshMemories();
  renderView();
  await firstRunCheck();
  if (state.activeMemoryId && state.activeMemoryId !== SESSION_ID) {
    await loadActiveIndex({ silent: true });
  }
}
